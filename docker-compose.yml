services:
  postgres:
    image: postgres:16-alpine
    container_name: whopaid-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: whopaid
      POSTGRES_USER: whopaid
      POSTGRES_PASSWORD: whopaid_secret

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whopaid -d whopaid"]
      interval: 10s
      timeout: 5s
      retries: 6

    networks:
      - internal

  api:
    image: ghcr.io/arvinzaferani/kidad-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: whopaid-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PORT: 3008
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://kidad.ir}
      DATABASE_URL: postgres://whopaid:whopaid_secret@postgres:5432/whopaid
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      DB_CONNECT_TIMEOUT_MS: "5000"

      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@kidad.ir}

      APP_WEB_URL: ${APP_WEB_URL:-https://kidad.ir}
      EMAIL_VERIFY_TTL_MINUTES: ${EMAIL_VERIFY_TTL_MINUTES:-30}

      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:-mail.kidad.ir}

    command: sh -c "npm run typeorm:migration:run && npm run start"

    networks:
      - internal
      - proxy

  web:
    image: ghcr.io/arvinzaferani/kidad-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.kidad.ir}

    container_name: whopaid-web
    restart: unless-stopped

    depends_on:
      - api

    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.kidad.ir}
      NODE_ENV: production

    networks:
      - internal
      - proxy

volumes:
  pgdata:

networks:
  internal:
    driver: bridge

  proxy:
    external: true